async function checkAuth() {
  if (!_supabase) return;
  try {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session && session.user) {
      document.getElementById("auth-gate").style.display = "none";
      document.getElementById("app").style.display = "block";
      await cargarHistorialSupabase();
      r();
    } else {
      showLoginGate();
    }
  } catch (err) {
    console.error("Erro na verificación da sesión:", err);
    showLoginGate();
  }
}

function showLoginGate() {
  document.getElementById("app").style.display = "none";
  document.getElementById("auth-gate").style.display = "flex";

  const emailInput = document.getElementById("auth-email");
  const passInput = document.getElementById("auth-password");
  const errBox = document.getElementById("auth-error");
  const btn = document.getElementById("btn-login");

  if (emailInput) emailInput.value = "";
  if (passInput) passInput.value = "";
  if (errBox) { errBox.style.display = "none"; errBox.textContent = ""; }
  if (btn) { btn.disabled = false; btn.textContent = "Acceder ao Panel"; }
}

async function handleAuth(e) {
  e.preventDefault();
  if (!_supabase) return;

  const emailInput = document.getElementById("auth-email");
  const passInput = document.getElementById("auth-password");
  const errBox = document.getElementById("auth-error");
  const btn = document.getElementById("btn-login");

  const email = emailInput.value.trim().toLowerCase();
  const password = passInput.value;

  errBox.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Verificando...";

  for (let key in localStorage) {
    if (key.startsWith("sb-")) localStorage.removeItem(key);
  }

  try {
    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
    if (error) {
      console.error("Erro Auth:", error.message);
      errBox.textContent = "⛔ Acceso denegado: Correo ou contrasinal incorrectos.";
      errBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Acceder ao Panel";
    } else {
      checkAuth();
    }
  } catch (err) {
    errBox.textContent = "❌ Erro de conexión.";
    errBox.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Acceder ao Panel";
  }
}

async function logout() {
  showLoginGate();
  try {
    if (_supabase) {
      await Promise.race([
        _supabase.auth.signOut(),
        new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), 2000))
      ]);
    }
  } catch (err) {
    console.warn("Peche local completado:", err.message);
  } finally {
    for (let key in localStorage) {
      if (key.startsWith("sb-")) localStorage.removeItem(key);
    }
  }
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function sel(id,value,options,label,icon){

}

function renderMD(text, accent){
  return text.split("\n").map(line=>{
    if(/^#{1,3} /.test(line)) return`<h3 style="color:${accent||"#1E3A5F"};font-weight:800;font-size:16px;margin-top:18px;margin-bottom:6px">${esc(line.replace(/^#{1,3} /,"").replace(/\*\*/g,""))}</h3>`;
    if(/^[🎯📚✅💡☑️📊🏠⚡🔵📖🌱👁️♿🌟📋]/.test(line)) return`<h3 style="color:${accent||"#1E3A5F"};font-weight:800;font-size:16px;margin-top:18px;margin-bottom:6px">${esc(line.replace(/\*\*/g,""))}</h3>`;
    if(line.startsWith("- ")||line.startsWith("• ")){
      const h=line.replace(/^[-•] /,"").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
      return`<li style="margin-left:18px;margin-bottom:4px;color:#374151;list-style-type:disc">${h}</li>`;
    }
    if(/^\d+\./.test(line)){
      const h=line.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
      return`<li style="margin-left:18px;margin-bottom:4px;color:#374151;list-style-type:decimal">${h}</li>`;
    }
    if(line.startsWith("**")&&line.endsWith("**")) return`<p style="font-weight:800;color:#1E3A5F;margin-top:10px;margin-bottom:4px">${esc(line.replace(/\*\*/g,""))}</p>`;
    if(line.includes("**")){const h=line.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");return`<p style="color:#374151;margin-bottom:3px;line-height:1.6">${h}</p>`;}
    if(line.startsWith("---")) return`<hr style="border:none;border-top:1px solid #E2E8F0;margin:12px 0"/>`;
    if(line.trim()==="") return`<div style="height:6px"></div>`;
    return`<p style="color:#374151;margin-bottom:3px;line-height:1.6">${esc(line).replace(/\*\*/g,"")}</p>`;
  }).join("");
}

        <button onclick="setStep(2)" ${!S.perfil?"disabled":""} class="btn" style="margin-top:16px;width:100%;background:${S.perfil?`linear-gradient(135deg,${pC},${pC}CC)`:"#E2E8F0"};color:white;padding:13px;border-radius:12px;font-size:15px;font-weight:800">Continuar →</button>`;
    } else if(step===2){

      inner=`<h2 style="font-size:20px;font-weight:900;color:#1E3A5F;margin-bottom:4px">2. Datos do alumno/a</h2>
        <p style="color:#64748B;font-size:13px;margin-bottom:16px">Canta máis información achegues, máis específicas serán as adaptacións</p>
        <div style="background:white;border-radius:14px;border:1px solid #E2E8F0;padding:18px;display:grid;gap:14px">

    } else if(step===3){

    } else if(step===4){
      const showMat=S.docs.some(d=>["orientacions","lista_control","cotexo","rubrica"].includes(d));
      inner=`<h2 style="font-size:20px;font-weight:900;color:#1E3A5F;margin-bottom:4px">4. Documentos e materias</h2>
        <p style="color:#64748B;font-size:13px;margin-bottom:14px">Que queres xerar?</p>
        <div style="background:white;border-radius:14px;border:1px solid #E2E8F0;overflow:hidden;margin-bottom:16px">
          ${DOCS.map((d,i)=>{const sel=S.docs.includes(d.id);return`
            <div onclick="togDoc('${d.id}')" style="padding:12px 16px;display:flex;align-items:center;gap:12px;${i<DOCS.length-1?"border-bottom:1px solid #F1F5F9;":""}cursor:pointer;background:${sel?pB:"white"};transition:background .15s">
              <div style="width:20px;height:20px;border-radius:5px;border:2px solid ${sel?pC:"#CBD5E1"};background:${sel?pC:"white"};display:flex;align-items:center;justify-content:center;flex-shrink:0">
                ${sel?`<span style="color:white;font-size:11px;font-weight:900">✓</span>`:""}
              </div>

                <div style="font-weight:700;color:#1E3A5F;font-size:14px">${d.emoji} ${d.label}</div>

            </div>`}).join("")}
        </div>
        ${showMat?`<div style="background:white;border-radius:14px;border:1px solid #E2E8F0;padding:16px;margin-bottom:16px">
          <label style="font-weight:700;color:#374151;font-size:13px;display:block;margin-bottom:10px">📚 Materias (opcional)</label>
          <div style="display:flex;flex-wrap:wrap;gap:7px">
            ${(MATERIAS[S.etapa]||[]).map(m=>{const sel=S.materias.includes(m);return`<button onclick="togMateria('${esc(m)}')" class="btn" style="padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid ${sel?pC:"#E2E8F0"};background:${sel?pB:"white"};color:${sel?pC:"#64748B"}">${sel?"✓ ":""}${esc(m)}</button>`}).join("")}
          </div>
        </div>`:""}
        <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px">
          <button onclick="setStep(3)" class="btn" style="background:#F1F5F9;color:#475569;padding:12px;border-radius:12px;font-size:14px;font-weight:700">← Volver</button>
          <button onclick="xerar()" ${S.docs.length===0?"disabled":""} class="btn" style="background:linear-gradient(135deg,#2563EB,#1D4ED8);color:white;padding:12px;border-radius:12px;font-size:14px;font-weight:800">
            ✨ Xerar documento (${S.docs.length} doc${S.docs.length>1?"s":""})
          </button>
        </div>`;
    }
    body=`<div class="fade">${progressBar()}${inner}</div>`;
  } else if(pantalla==="resultado"){
    body=`<div class="fade">
      <div class="no-print" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
        ${chip(p.emoji+" "+p.label,pC,pB)}
        ${chip(S.curso+" · "+S.etapa)}
        ${chip(S.intensidade)}
        ${S.nome?chip("👤 "+S.nome,"#1E3A5F","#EFF6FF"):""}
      </div>
      <div class="print-box" style="background:white;border-radius:14px;border:1px solid #E2E8F0;padding:18px 20px;margin-bottom:14px;max-height:480px;overflow-y:auto;line-height:1.75">
        ${renderMD(S.resultado,pC)}
      </div>
      <div class="no-print" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px">
        <button onclick="copiar()" class="btn" style="background:${S.copiado?"#D1FAE5":"#F1F5F9"};color:${S.copiado?"#065F46":"#374151"};padding:11px;border-radius:12px;font-size:13px;font-weight:700">
          ${S.copiado?"✅ Copiado":"📋 Copiar"}
        </button>
        <button onclick="gardar()" ${S.gardado?"disabled":""} id="btn-gardar" class="btn" style="background:${S.gardado?"#D1FAE5":"#ECFDF5"};color:${S.gardado?"#065F46":"#059669"};padding:11px;border-radius:12px;font-size:13px;font-weight:700;border:1.5px solid ${S.gardado?"#6EE7B7":"#A7F3D0"}">
          ${S.gardado?"✅ Gardado":"💾 Gardar"}
        </button>
        <button onclick="window.print()" class="btn" style="background:#EFF6FF;color:#2563EB;padding:11px;border-radius:12px;font-size:13px;font-weight:700;border:1.5px solid #BFDBFE">🖨️ PDF</button>
        <button onclick="nova()" class="btn" style="background:linear-gradient(135deg,#2563EB,#1D4ED8);color:white;padding:11px;border-radius:12px;font-size:13px;font-weight:800">✨ Nova</button>
      </div>
      <button onclick="setStep(4);S.pantalla='wizard';r()" class="btn no-print" style="width:100%;background:#F8FAFC;color:#475569;padding:10px;border-radius:12px;font-size:13px;font-weight:700;border:1.5px solid #E2E8F0">← Cambiar parámetros e rexenerar</button>
    </div>`;
  } else if(pantalla==="historial"){
    body=`<div class="fade">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <div>
          <h2 style="font-size:20px;font-weight:900;color:#1E3A5F">📋 Historial de Adaptacións</h2>
          <p style="color:#64748B;font-size:13px">${S.historial.length} adaptacións rexistradas na nube</p>
        </div>
        <button onclick="nova()" class="btn" style="background:linear-gradient(135deg,#2563EB,#1D4ED8);color:white;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700">+ Nova</button>
      </div>
      ${S.historial.length===0?`<div style="text-align:center;padding:48px 20px;background:white;border-radius:14px;border:1px solid #E2E8F0">
        <div style="font-size:44px;margin-bottom:10px">📭</div>
        <div style="font-weight:700;color:#94A3B8">Aínda non hai adaptacións gardadas na base de datos</div>
      </div>`:S.historial.map(h=>{
        const hp=PERFILES.find(p=>p.id===h.perfil)||{};
        const open=S.hItem===h.id;
        return`<div onclick="togHItem('${h.id}')" class="hov" style="background:white;border-radius:14px;border:1px solid #E2E8F0;overflow:hidden;margin-bottom:10px">
          <div style="padding:13px 16px;display:flex;align-items:center;gap:12px">
            <div style="width:40px;height:40px;border-radius:10px;background:${hp.bg||"#F1F5F9"};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${hp.emoji||"📄"}</div>
            <div style="flex:1">
              <div style="font-weight:800;color:#1E3A5F;font-size:14px">${esc(h.alumno)} ${chip(h.perfil,hp.color,hp.bg)}</div>
              <div style="color:#94A3B8;font-size:11px;margin-top:2px">${esc(h.curso)} · ${esc(h.etapa)} · ${esc(h.data)}</div>
            </div>
            <div style="color:#CBD5E1">${open?"▲":"▼"}</div>
            <button onclick="borrarSupabase('${h.id}',event)" class="btn" style="background:#FEF2F2;color:#EF4444;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:700;border:1.5px solid #FECACA;margin-left:4px">🗑️</button>
          </div>
          ${open?`<div style="border-top:1px solid #F1F5F9;padding:14px 16px;background:#FAFAFA">
            <div style="font-size:13px;line-height:1.7;max-height:280px;overflow-y:auto">${renderMD(h.resultado,hp.color)}</div>
            <button onclick="copiarTexto('hid${h.id}',event)" id="hid${h.id}" class="btn" data-text="${esc(h.resultado)}" style="margin-top:10px;background:#F1F5F9;color:#374151;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700">📋 Copiar</button>
          </div>`:""}
        </div>`;
      }).join("")}
    </div>`;
  }

  return`${header}<div style="max-width:750px;margin:0 auto;padding:20px 14px">${body}</div>`;
}

// ── ACCIÓNS ────────────────────────────────────────────────────────────────
const TEXT_FIELDS=["nome","idade","outrasFortalezas","dificultades","apoios","observacins"];

function setState(k,v){
  if(k==="etapa"){S.etapa=v;S.curso=(CURSOS[v]||[])[0]||"";S.materias=[];r();}
  else if(TEXT_FIELDS.includes(k)){S[k]=v;}
  else{S[k]=v;r();}
}
function syncTextFields(){
  TEXT_FIELDS.forEach(k=>{
    const el=document.getElementById(k);
    if(el) S[k]=el.value;
  });
}
function setStep(n){syncTextFields();S.step=n;r();}
function setPerfil(id){S.perfil=id;S.necesidades=[];S.fortalezas=[];r();}
function togNecesidade(n){S.necesidades=S.necesidades.includes(n)?S.necesidades.filter(x=>x!==n):[...S.necesidades,n];r();}
function togFortaleza(f){S.fortalezas=S.fortalezas.includes(f)?S.fortalezas.filter(x=>x!==f):[...S.fortalezas,f];r();}
function togDoc(id){S.docs=S.docs.includes(id)?S.docs.filter(x=>x!==id):[...S.docs,id];r();}
function togMateria(m){S.materias=S.materias.includes(m)?S.materias.filter(x=>x!==m):[...S.materias,m];r();}
function togHItem(id){S.hItem=S.hItem===id?null:id;r();}
function goInicio(){S.pantalla="inicio";r();}
function goHistorial(){S.pantalla="historial";r();}

function nova(){
  S.pantalla="inicio";S.step=1;S.perfil=null;S.necesidades=[];
  S.nome="";S.idade="";S.fortalezas=[];S.outrasFortalezas="";S.dificultades="";S.apoios="";S.observacins="";
  S.materias=[];S.docs=["adaptacions"];S.resultado="";S.gardado=false;S.copiado=false;
  r();
}
function goWizard(){S.pantalla="wizard";S.step=1;r();}

// GENERADOR LOCAL DE ADAPTACIONES
function xerar(){
  syncTextFields();
  S.loading=true; S.resultado=""; S.gardado=false; r();

  setTimeout(() => {
    const p=pd();
    const nome=S.nome||"Alumno/a";
    const data=new Date().toLocaleDateString("gl-ES");
    const matsStr = S.materias.length ? S.materias.join(", ") : "Todas as áreas do currículo";

    let doc = `# ADAPTACIÓNS NEAE — ${p.label}\n`;
    doc += `**Alumno/a:** ${nome} | **Curso:** ${S.curso} de ${S.etapa} | **Intensidade:** ${S.intensidade} | **Data:** ${data}\n\n`;

    if (S.docs.includes("adaptacions")) {
      doc += `📋 **ADAPTACIÓNS CURRICULARES**\n\n`;
      doc += `🎯 **ADAPTACIÓNS DE ACCESO**\n`;
      doc += `- Situar a ${nome} nun lugar preferente na aula, lonxe de distractores e preto do profesor/a.\n`;
      doc += `- Espazo de traballo despexado, estruturado e con organizadores visuais das tarefas.\n`;
      doc += `- Permitir o uso de auriculares de cancelación de ruído durante as fases de traballo individual.\n\n`;

      doc += `📚 **ADAPTACIÓNS METODOLÓXICAS**\n`;
      doc += `- Fragmentar as instrucións e tarefas en pasos curtos e secuenciados.\n`;
      doc += `- Usar apoio visual (esquemas, pictogramas, mapas conceptuais) en todas as explicacións orais.\n`;
      doc += `- Alternar actividades de alta demanda cognitiva con momentos de descanso funcional.\n`;
      if (S.fortalezas.length) doc += `- Aproveitar as súas fortalezas (${S.fortalezas.join(", ")}) para reforzar a súa motivación e autonomía.\n`;
      doc += `\n✅ **ADAPTACIÓNS DE AVALIACIÓN**\n`;
      doc += `- Ampliar o tempo de realización das probas escritas (entre un 25% e un 50% máis).\n`;
      doc += `- Reducir a cantidade de exercicios por páxina mantendo a variedade de obxectivos a avaliar.\n`;
      doc += `- Permitir probas orais ou exames con apoio visual como alternativa ao formato escrito tradicional.\n\n`;
      doc += `---\n\n`;
    }

    if (S.docs.includes("orientacions")) {
      doc += `📚 **ORIENTACIÓNS PARA O PROFESORADO POR MATERIA**\n`;
      doc += `*Materias afectadas:* ${matsStr}\n\n`;
      doc += `- Proporcionar esquemas previos e resumos cos conceptos clave de cada unidade.\n`;
      doc += `- Explicar os enunciados de forma directa e verificar a comprensión antes de comezar.\n`;
      doc += `- Avaliar o contido e a lóxica das respostas por riba dos erros de presentación ou ortografía.\n\n`;
      doc += `---\n\n`;
    }

    if (S.docs.includes("lista_control")) {
      doc += `☑️ **LISTA DE CONTROL — SEGUIMENTO DO ALUMNO/A**\n\n`;
      doc += `- □ Mantén a atención nas explicacións iniciais (mínimo 10 min).\n`;
      doc += `- □ Completa as tarefas adaptadas no tempo establecido.\n`;
      doc += `- □ Utiliza de forma autónoma os apoios visuais e o material adaptado.\n`;
      doc += `- □ Solicita axuda do docente de forma adecuada cando se bloquea.\n`;
      doc += `- □ Acepta as transicións entre actividades e rutinas sen frustración.\n\n`;
      doc += `---\n\n`;
    }

    if (S.docs.includes("cotexo")) {
      doc += `📊 **LISTA DE COTEXO CRITERIAL**\n\n`;
      doc += `- **Acceso ao contorno:** Acadado ✓ | O alumno/a emprega correctamente o espazo adaptado.\n`;
      doc += `- **Seguimento de instrucións:** En proceso 🟡 | Comprende as instrucións cando son curtas e visuais.\n`;
      doc += `- **Execución autónoma:** En proceso 🟡 | Precisará de supervisión nas fases iniciais da tarefa.\n\n`;
      doc += `---\n\n`;
    }

    if (S.docs.includes("pautas_familia")) {
      doc += `🏠 **PAUTAS PARA A FAMILIA**\n\n`;
      doc += `1. Establecer unha rutina diaria na casa cun horario visual e predible para os deberes.\n`;
      doc += `2. Fragmentar o tempo de estudo en bloques curtos (15-20 min) con pequenos descansos.\n`;
      doc += `3. Valorar e felicitar o esforzo e o traballo diario, non só o resultado dos exames.\n`;
      doc += `4. Manter unha comunicación fluída e coordinada co equipo de orientación do centro.\n`;
    }

    S.resultado = doc;
    S.loading = false;
    S.pantalla = "resultado";
    r();
  }, 1000);
}

// ── PERSISTENCIA EN SUPABASE ────────────────────────────────────────────────
async function cargarHistorialSupabase() {
  if (!_supabase) return;
  try {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) return;

    const { data, error } = await _supabase
      .from('neae_adaptacions')
      .select('*')
      .order('creado_en', { ascending: false });

    if (!error && data) {
      S.historial = data.map(item => ({
        id: item.id,
        data: new Date(item.creado_en).toLocaleDateString("gl-ES"),
        alumno: item.alumno_nome || "Sen nome",
        perfil: item.perfil,
        etapa: item.etapa,
        curso: item.curso,
        resultado: item.resultado
      }));
    }
  } catch (err) {
    console.error("Erro ao cargar o historial de Supabase:", err);
  }
}

async function gardar() {
  if (!_supabase) return;
  const btn = document.getElementById("btn-gardar");
  if (btn) { btn.disabled = true; btn.textContent = "Gardando..."; }

  try {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session || !session.user) {
      alert("⛔ A túa sesión caducou. Por favor, volve acceder.");
      showLoginGate();
      return;
    }

    const rexistro = {
      creado_por: session.user.id,
      alumno_nome: S.nome ? S.nome.trim() : "Sen nome",
      perfil: S.perfil,
      etapa: S.etapa,
      curso: S.curso,
      resultado: S.resultado,
      datos_json: { necesidades: S.necesidades, materias: S.materias, docs: S.docs }
    };

    const { error } = await _supabase
      .from('neae_adaptacions')
      .insert([rexistro]);

    if (error) {
      console.error("Detalle do erro de Supabase:", error);
      throw error;
    }

    S.gardado = true;
    await cargarHistorialSupabase();
    r();
  } catch (err) {
    console.error("Erro ao gardar en Supabase:", err);
    alert("⛔ Non se puido gardar na base de datos. Revisa os permisos.");
    if (btn) { btn.disabled = false; btn.textContent = "💾 Gardar"; }
  }
}

async function borrarSupabase(id, ev) {
  ev.stopPropagation();
  if (!_supabase || !confirm("Estás segura de que queres eliminar esta adaptación?")) return;

  try {
    const { error } = await _supabase.from('neae_adaptacions').delete().eq('id', id);
    if (!error) {
      await cargarHistorialSupabase();
      r();
    }
  } catch (err) {
    console.error("Erro ao eliminar de Supabase:", err);
  }
}

async function copiar(){
  try{await navigator.clipboard.writeText(S.resultado);}
  catch{const el=document.createElement("textarea");el.value=S.resultado;el.style.cssText="position:fixed;opacity:0";document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);}
  S.copiado=true; r(); setTimeout(()=>{S.copiado=false;r();},2000);
}

async function copiarTexto(btnId,ev){
  ev.stopPropagation();
  const btn=document.getElementById(btnId);
  const text=btn?.dataset?.text||"";
  try{await navigator.clipboard.writeText(text);}
  catch{const el=document.createElement("textarea");el.value=text;el.style.cssText="position:fixed;opacity:0";document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);}
  if(btn){btn.textContent="✅ Copiado";setTimeout(()=>{btn.textContent="📋 Copiar";},2000);}
}

document.addEventListener("DOMContentLoaded", () => {
  checkAuth();
});
</script>
