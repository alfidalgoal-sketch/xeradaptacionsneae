<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sociograma de aula</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F8FAFC;--card:#FFFFFF;--ink:#1E293B;--muted:#64748B;--line:#E2E8F0;
  --brand:#2563EB;--brand-dark:#1E3A5F;--ok:#15803D;--ok-bg:#DCFCE7;--bad:#B91C1C;--bad-bg:#FEE2E2;
  --warn:#B45309;--warn-bg:#FEF3C7;--info-bg:#DBEAFE;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
input,textarea,select{font-family:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.narrow{max-width:520px}
.top{background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:900}
.top small{opacity:.85;font-size:12px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.btn{padding:11px 18px;border-radius:12px;font-weight:800;font-size:15px;background:var(--brand);color:#fff;transition:filter .15s,transform .15s;display:inline-block;text-decoration:none;text-align:center}
.btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6);padding:8px 14px;font-size:13px}
.btn.danger{background:var(--bad)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.big{font-size:18px;padding:14px 26px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.muted{color:var(--muted)}
h2{font-size:22px;font-weight:900;color:var(--brand-dark);margin-bottom:10px}
h3{font-size:16px;font-weight:800;margin-bottom:8px}
label{font-weight:700;font-size:13px;display:block;margin:12px 0 5px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;margin-top:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.info{background:var(--info-bg);color:var(--brand)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:900;letter-spacing:2px}
.linkbox{display:flex;gap:8px;align-items:center;background:#F1F5F9;border-radius:10px;padding:8px 10px;word-break:break-all;font-size:14px}
.linkbox span{flex:1}
ol.steps{padding-left:22px;line-height:1.7}
/* Alumnado */
.kid{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.kid h2{font-size:26px;text-align:center;line-height:1.25}
.q{font-size:24px;font-weight:900;text-align:center;color:var(--brand-dark);margin:8px 0 6px;line-height:1.3}
.qsub{text-align:center;color:var(--muted);font-size:16px;margin-bottom:16px}
.name{background:#fff;border:3px solid var(--line);border-radius:16px;padding:16px 10px;font-size:20px;font-weight:900;color:var(--ink);text-align:center;min-height:68px;transition:all .15s;position:relative}
.name:hover:not(:disabled){border-color:var(--brand);transform:translateY(-2px)}
.name.sel{background:var(--info-bg);border-color:var(--brand);color:var(--brand-dark)}
.name.sel::after{content:attr(data-n);position:absolute;top:-10px;right:-10px;background:var(--brand);color:#fff;width:28px;height:28px;border-radius:50%;font-size:15px;line-height:28px}
.name:disabled{opacity:.35;cursor:not-allowed}
.name.done{opacity:.5}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog>div{height:100%;background:linear-gradient(90deg,#22C55E,var(--brand));transition:width .3s}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.nav .btn{font-size:18px;padding:14px 26px}
.rk{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rk .nm{flex:1 1 120px;font-weight:900;font-size:20px}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.face{background:#fff;border:2.5px solid var(--line);border-radius:12px;padding:6px 8px;min-width:60px;font-size:12px;font-weight:800;color:var(--muted);text-align:center}
.face span{display:block;font-size:26px;line-height:1.1}
.face.on{border-color:var(--brand);background:var(--info-bg);color:var(--brand-dark)}
/* Resultados */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:9px 14px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:14px;color:var(--muted)}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:center}
th{background:#F1F5F9;font-size:12px;font-weight:800}
th.sort{cursor:pointer}
th.sort:hover{background:#E2E8F0}
td.l,th.l{text-align:left;white-space:nowrap}
.e{color:var(--ok);font-weight:800}.r{color:var(--bad);font-weight:800}
td.mx{width:30px;height:30px;padding:0;font-weight:900}
td.mxE{background:var(--ok-bg);color:var(--ok)}
td.mxR{background:var(--bad-bg);color:var(--bad)}
td.self{background:#E2E8F0}
th.vert{writing-mode:vertical-rl;transform:rotate(180deg);height:110px;white-space:nowrap;font-weight:700}
.alert{border-left:5px solid;padding:12px 14px;border-radius:10px;margin-bottom:10px}
.alert.bad{border-color:var(--bad);background:var(--bad-bg)}
.alert.warn{border-color:var(--warn);background:var(--warn-bg)}
.alert.info{border-color:var(--brand);background:var(--info-bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{font-size:28px;display:block;color:var(--brand-dark)}
.kpi span{font-size:13px;color:var(--muted);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px}
.gcard{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer}
.gcard:hover{border-color:var(--brand)}
/* Fichas de códigos */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cut{border:2px dashed #94A3B8;border-radius:12px;padding:14px;text-align:center;break-inside:avoid}
.cut b{font-size:22px;display:block}
.cut .code{font-size:26px;color:var(--brand-dark);display:block;margin:6px 0}
.cut small{font-size:11px;color:var(--muted);word-break:break-all}
.loading{text-align:center;padding:60px 16px;color:var(--muted);font-weight:800}
@media (max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}.face{min-width:0;flex:1;padding:5px 2px;font-size:10px}.faces{flex-wrap:nowrap;width:100%;gap:4px}.face span{font-size:24px}}
@media print{
  .no-print{display:none!important}
  body{background:#fff}
  .card{border:none;padding:0}
  .wrap{max-width:none;padding:0}
  .cards{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando...</div></div>

<script>
/* ==========================================================================
   SOCIOGRAMA DE AULA (versión en liña)
   - Orientación: entra coa conta de ControlAula, crea grupos e ve resultados.
   - Titores: abren ?g=CÓDIGO e aplican o cuestionario (dispositivo compartido).
   - Alumnado: abre a páxina e escribe o seu código persoal (dispositivo propio).
   Os datos gárdanse en Supabase (táboas sg_*). Ver supabase/sociograma.sql
   ========================================================================== */

const SUPABASE_URL = "https://gnzqvwmwvsfjjwvzqcjy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduenF2d213dnNmamp3dnpxY2p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3Mjc5MjksImV4cCI6MjA5MTMwMzkyOX0.VVY85EnMX5rILMiPJcxhUI537ZFfT1ppu1zAhFGtqgE";
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const MODELS = {
  A: {
    nome: '1º e 2º ciclo (versión simple)',
    nominacions: [
      { k:'xs', tipo:'E', ambito:'xogar', curto:'Eleccións',
        txt:'Quen son os tres nenos ou nenas da túa clase cos que MÁIS che gusta xogar ou estar?',
        por:'Por que che gusta xogar ou estar con eles ou con elas?' },
      { k:'xn', tipo:'R', ambito:'xogar', curto:'Rexeitamentos',
        txt:'Quen son os tres nenos ou nenas da túa clase cos que MENOS che gusta xogar ou estar?',
        por:'Por que non che gusta xogar ou estar con eles ou con elas?' }
    ],
    atributos: [
      { k:'a1', s:+1, txt:'Ten moitos amigos e amigas' },
      { k:'a2', s:+1, txt:'Está alegre moitas veces' },
      { k:'a3', s:+1, txt:'Axuda aos outros nenos e nenas' },
      { k:'a4', s:-1, txt:'Está triste moitas veces' },
      { k:'a5', s:-1, txt:'Ten poucos amigos e está só ou soa moitas veces' },
      { k:'a6', s:-1, txt:'Insulta e pelexa' }
    ],
    rankingTxt: 'Canto che gusta xogar ou estar con...?',
    escala: [ {v:1,t:'Moito',e:'😀'}, {v:2,t:'Regular',e:'😐'}, {v:3,t:'Pouco',e:'🙁'} ],
    corteRanking: 2.5
  },
  B: {
    nome: '3º ciclo / 4º-6º EP (cuestionario completo)',
    nominacions: [
      { k:'ts', tipo:'E', ambito:'traballar', curto:'E. traballar',
        txt:'Quen son os tres rapaces ou rapazas da túa clase cos que MÁIS che gusta traballar?',
        por:'Por que che gusta traballar con eles ou con elas?' },
      { k:'tn', tipo:'R', ambito:'traballar', curto:'R. traballar',
        txt:'Quen son os tres rapaces ou rapazas da túa clase cos que MENOS che gusta traballar?',
        por:'Por que non che gusta traballar con eles ou con elas?' },
      { k:'ls', tipo:'E', ambito:'libre', curto:'E. tempo libre',
        txt:'Quen son os tres rapaces ou rapazas da túa clase cos que MÁIS che gusta estar no tempo libre (saír, nos recreos...)?',
        por:'Por que che gusta estar con eles ou con elas?' },
      { k:'ln', tipo:'R', ambito:'libre', curto:'R. tempo libre',
        txt:'Quen son os tres rapaces ou rapazas da túa clase cos que MENOS che gusta estar no tempo libre (saír, nos recreos...)?',
        por:'Por que non che gusta estar con eles ou con elas?' }
    ],
    atributos: [
      { k:'a1',  s:+1, txt:'Ter moitos amigos/as' },
      { k:'a2',  s:-1, txt:'Non ter amigos/as' },
      { k:'a3',  s:+1, txt:'Levarse ben cos profesores/as' },
      { k:'a4',  s:-1, txt:'Levarse mal cos profesores/as' },
      { k:'a5',  s:+1, txt:'Ser simpático/a cos compañeiros/as' },
      { k:'a6',  s:-1, txt:'Ser antipático/a cos compañeiros/as' },
      { k:'a7',  s:+1, txt:'A súa capacidade para atender e escoitar aos demais' },
      { k:'a8',  s:-1, txt:'Estar frecuentemente a chamar a atención dos demais' },
      { k:'a9',  s:+1, txt:'A súa capacidade para resolver conflitos entre compañeiros/as' },
      { k:'a10', s:-1, txt:'A súa agresividade' },
      { k:'a11', s:+1, txt:'Saber comunicarse' },
      { k:'a12', s:-1, txt:'Ter problemas para comunicarse' }
    ],
    rankingTxt: 'Como che cae...?',
    escala: [ {v:1,t:'Moi ben',e:'😄'}, {v:2,t:'Ben',e:'🙂'}, {v:3,t:'Regular',e:'😐'}, {v:4,t:'Mal',e:'🙁'}, {v:5,t:'Moi mal',e:'😣'} ],
    corteRanking: 3.5
  }
};

/* ---------------- Estado ---------------- */
// S: grupo cargado (resultados ou aplicación). Mesmo formato que a versión local.
let S = { config:null, respostas:{} };
// CTX: modo de acceso actual
let CTX = { modo:null, grupoCod:null, alumnoCod:null, info:null, grupoId:null, grupoRow:null, codigos:null };
let V = { view:'loading', kid:null, step:0, draft:null, tab:'aplicar', sort:{k:'nome',d:1}, filtro:'E', err:'', busy:false, grupos:[], user:null, edit:null };

const M = () => MODELS[S.config.modelo];
const al = () => S.config.alumnos;
const byId = id => al().find(a => a.id === id);
const nm = id => (byId(id)||{nome:'?'}).nome;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
const curto = n => { const p = n.trim().split(/\s+/); return p.length>1 && n.length>8 ? p[0]+' '+p[1][0]+'.' : n; };
const iniciais = n => { const t = n.trim(); if (t.replace(/[\s.]/g,'').length<=4) return t.replace(/[\s.]/g,''); return t.split(/\s+/).slice(0,2).map(p=>p[0]).join('').toUpperCase(); };
const BASE = location.origin + location.pathname;
const ALFA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function code(n){ const a = new Uint32Array(n); crypto.getRandomValues(a); return [...a].map(x=>ALFA[x%ALFA.length]).join(''); }
const pendKey = 'sociograma_pendentes_v2';

/* ---------------- Render ---------------- */
function render(){
  const app = document.getElementById('app');
  const views = { loading:()=>'<div class="loading">Cargando...</div>', landing:viewLanding, login:viewLogin, panel:viewPanel,
    edit:viewEdit, results:viewResults, tutor:viewTutor, kidpick:viewKidPick, kid:viewKid, kidend:viewKidEnd, codigos:viewCodigos, msg:viewMsg };
  app.innerHTML = views[V.view]();
  if (V.view==='results' && V.tab==='grafo') drawGraph();
}
function go(view){ V.view = view; V.err=''; V.warn=null; window.scrollTo(0,0); render(); }
function topbar(title, sub, right=''){
  return `<div class="top no-print"><div><h1>${title}</h1><small>${esc(sub)}</small></div><div class="row">${right}</div></div>`;
}
function viewMsg(){ return topbar('🕸️ Sociograma de aula','') + `<div class="wrap narrow"><div class="card" style="text-align:center">${V.msg}</div></div>`; }
function showMsg(html){ V.msg = html; go('msg'); }

/* ---------------- Inicio ---------------- */
async function boot(){
  if (!sb){ showMsg('<h2>Non se puido cargar</h2><p class="muted">Comproba a conexión a internet e recarga a páxina.</p>'); return; }
  const p = new URLSearchParams(location.search);
  if (p.get('g')) return openTutor(p.get('g'));
  if (p.get('c')) return openAlumno(p.get('c'));
  const { data:{ session } } = await sb.auth.getSession();
  if (session){ V.user = session.user; return loadPanel(); }
  go('landing');
}

function viewLanding(){
  return topbar('🕸️ Sociograma de aula','') + `
  <div class="wrap narrow">
    <div class="card" style="text-align:center">
      <div style="font-size:52px">🧒</div>
      <h2>Son alumno ou alumna</h2>
      <p class="muted" style="margin-bottom:14px">Escribe o código que che deu o teu titor ou titora</p>
      <input id="c-in" class="code" style="text-align:center;font-size:26px;text-transform:uppercase" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="CÓDIGO"
        onkeydown="if(event.key==='Enter')openAlumno(this.value)">
      <button class="btn big" style="margin-top:14px;width:100%" onclick="openAlumno(document.getElementById('c-in').value)">Entrar</button>
      ${V.err?`<div class="err">${esc(V.err)}</div>`:''}
    </div>
    <div class="card"><h3>👩‍🏫 Son titor ou titora</h3>
      <p class="muted">Abre a ligazón que che enviou o Departamento de Orientación.</p></div>
    <div class="card"><h3>🔐 Departamento de Orientación</h3>
      <p class="muted" style="margin-bottom:12px">Acceso coa conta de ControlAula para crear grupos e ver resultados.</p>
      <button class="btn sec" onclick="go('login')">Entrar</button></div>
  </div>`;
}

/* ---------------- Login orientación ---------------- */
function viewLogin(){
  return topbar('🕸️ Sociograma de aula','Departamento de Orientación', `<button class="btn ghost" onclick="go('landing')">Volver</button>`) + `
  <div class="wrap narrow"><div class="card">
    <h2>Acceso de orientación</h2>
    <p class="muted">Usa a túa conta de ControlAula.</p>
    <form onsubmit="doLogin(event)">
      <label>Correo</label><input id="l-mail" type="email" autocomplete="username" value="${esc(V.loginMail||'')}" required>
      <label>Contrasinal</label><input id="l-pass" type="password" autocomplete="current-password" required>
      <button class="btn" style="margin-top:16px;width:100%" ${V.busy?'disabled':''}>${V.busy?'Verificando...':'Entrar'}</button>
    </form>
    ${V.err?`<div class="err">${esc(V.err)}</div>`:''}
  </div></div>`;
}
async function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('l-mail').value.trim().toLowerCase(), password = document.getElementById('l-pass').value;
  V.loginMail = email;
  V.busy = true; V.err=''; render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  V.busy = false;
  if (error){
    const m = error.message||'';
    V.err = /invalid login|credentials/i.test(m) ? 'Correo ou contrasinal incorrectos. (Usa o mesmo correo e contrasinal da web de adaptacións NEAE.)'
          : /api key|apikey|jwt|signature/i.test(m) ? 'Erro de configuración: a clave de Supabase non é válida. ('+m+')'
          : /email not confirmed/i.test(m) ? 'O correo aínda non está confirmado en Supabase.'
          : 'Non se puido entrar: '+m;
    render(); return; }
  V.user = data.user; loadPanel();
}
async function logout(){ try { await sb.auth.signOut(); } catch(e){} V.user=null; go('landing'); }

/* ---------------- Panel de orientación ---------------- */
async function loadPanel(){
  V.view='loading'; render();
  const { data, error } = await sb.from('sg_grupos').select('id,nome,modelo,codigo,activo,creado_en,sg_alumnos(count),sg_respostas(count)').order('creado_en',{ascending:false});
  if (error){
    if (/sg_grupos|relation|schema cache/i.test(error.message))
      return showMsg(`<h2>Falta preparar a base de datos</h2><p class="muted">Hai que executar o ficheiro <b>supabase/sociograma.sql</b> no SQL Editor de Supabase.</p><p class="hint">${esc(error.message)}</p><button class="btn sec" style="margin-top:14px" onclick="logout()">Saír</button>`);
    return showMsg(`<h2>Erro</h2><p class="muted">${esc(error.message)}</p><button class="btn sec" style="margin-top:14px" onclick="logout()">Saír</button>`);
  }
  V.grupos = data || []; go('panel');
}
function viewPanel(){
  return topbar('🕸️ Sociograma de aula', 'Orientación · '+(V.user?.email||''), `<button class="btn ghost" onclick="logout()">Saír</button>`) + `
  <div class="wrap">
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <h2 style="margin:0">Os meus grupos</h2>
      <div class="row"><label class="btn sec" style="margin:0">⬆ Importar ficheiro<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this,null)"></label>
      <button class="btn" onclick="openEdit(null)">+ Novo grupo</button></div>
    </div>
    ${V.grupos.length ? V.grupos.map(g=>{
      const n = g.sg_alumnos?.[0]?.count||0, r = g.sg_respostas?.[0]?.count||0;
      return `<div class="card gcard" onclick="openGrupo('${g.id}')"><div><h3 style="margin:0">${esc(g.nome)}</h3>
        <div class="hint">${esc(MODELS[g.modelo].nome)} · código <span class="code">${g.codigo}</span></div></div>
        <div class="row">${g.activo?'<span class="pill ok">Aberto</span>':'<span class="pill warn">Pechado</span>'}
        <span class="pill info">${r}/${n} respostas</span></div></div>`; }).join('')
    : `<div class="card"><p>Aínda non tes grupos. Preme <b>+ Novo grupo</b> para crear o primeiro.</p></div>`}
  </div>`;
}

/* ---------------- Crear / editar grupo ---------------- */
function openEdit(g){
  V.edit = g ? { id:CTX.grupoId, nome:S.config.grupo, modelo:S.config.modelo, nomes:al().map(a=>a.nome).join('\n'), hasResp:Object.keys(S.respostas).length>0 }
             : { id:null, nome:'', modelo:'B', nomes:'', hasResp:false };
  go('edit');
}
function viewEdit(){
  const e = V.edit;
  return topbar('🕸️ Sociograma de aula', e.id?'Editar grupo':'Novo grupo', `<button class="btn ghost" onclick="${e.id?`openGrupo('${e.id}')`:'loadPanel()'}">Cancelar</button>`) + `
  <div class="wrap narrow"><div class="card">
    <h2>${e.id?'Editar grupo':'Novo grupo'}</h2>
    <label>Nome do grupo</label>
    <input id="f-grupo" autocomplete="off" value="${esc(e.nome)}" placeholder="Ex.: 4º EP A">
    <label>Cuestionario</label>
    <select id="f-modelo" ${e.hasResp?'disabled':''}>${Object.entries(MODELS).map(([k,m])=>`<option value="${k}" ${e.modelo===k?'selected':''}>${esc(m.nome)}</option>`).join('')}</select>
    ${e.hasResp?'<div class="hint">Non se pode cambiar porque xa hai respostas.</div>':''}
    <label>Alumnado (un por liña)</label>
    <textarea id="f-alumnos" rows="14" autocomplete="off" placeholder="AP&#10;BC&#10;CV&#10;...">${esc(e.nomes)}</textarea>
    <div class="hint">Recomendado: <b>inicial do nome + inicial do primeiro apelido</b> (ex.: Ana Pérez → <b>AP</b>). Se se repiten, engade un número: AP1, AP2.
    ${e.id?'<br>Se quitas un nome, bórranse tamén as súas respostas.':''}</div>
    ${V.err?`<div class="err">${esc(V.err)}</div>`:''}
    <div class="row" style="margin-top:18px"><button class="btn" ${V.busy?'disabled':''} onclick="saveEdit()">${V.busy?'Gardando...':'Gardar'}</button></div>
  </div></div>`;
}
async function saveEdit(){
  const e = V.edit;
  const nome = document.getElementById('f-grupo').value.trim();
  const modelo = document.getElementById('f-modelo').value;
  const nomes = document.getElementById('f-alumnos').value.split('\n').map(s=>s.trim()).filter(Boolean);
  Object.assign(e, { nome, modelo, nomes:nomes.join('\n') });
  if (!nome){ V.err='Escribe o nome do grupo.'; return render(); }
  if (nomes.length < 4){ V.err='Introduce polo menos 4 alumnos/as.'; return render(); }
  const dups = [...new Set(nomes.filter((n,i)=>nomes.findIndex(m=>norm(m)===norm(n))!==i))];
  if (dups.length){ V.err=`Hai iniciais repetidas: ${dups.join(', ')}. Engade un número para distinguilos (ex.: ${dups[0]}1, ${dups[0]}2).`; return render(); }
  V.busy = true; V.err=''; render();
  try {
    if (!e.id){
      const g = await createGroup(nome, modelo, nomes);
      V.busy=false; return openGrupo(g.id, 'aplicar');
    }
    // edición
    const prev = al();
    const quitar = prev.filter(p=>!nomes.some(n=>norm(n)===norm(p.nome)));
    const novos = nomes.filter(n=>!prev.some(p=>norm(p.nome)===norm(n)));
    const conResp = quitar.filter(q=>S.respostas[q.id]);
    if (quitar.length && !confirm(`Vas quitar: ${quitar.map(q=>q.nome).join(', ')}.` + (conResp.length?`\n${conResp.map(q=>q.nome).join(', ')} xa respondeu e borraranse esas respostas.`:'') + '\nContinuar?')){ V.busy=false; return render(); }
    let r = await sb.from('sg_grupos').update({ nome, ...(e.hasResp?{}:{modelo}) }).eq('id', e.id); if (r.error) throw r.error;
    if (quitar.length){ r = await sb.from('sg_alumnos').delete().in('id', quitar.map(q=>q.id)); if (r.error) throw r.error; }
    if (novos.length){ await insertAlumnos(e.id, novos, prev.length); }
    V.busy=false; openGrupo(e.id, 'aplicar');
  } catch(err){ V.busy=false; V.err='Non se puido gardar: '+(err.message||err); render(); }
}
async function createGroup(nome, modelo, nomes){
  let g, error;
  for (let i=0;i<5;i++){
    ({ data:g, error } = await sb.from('sg_grupos').insert({ nome, modelo, codigo:code(6) }).select().single());
    if (!error) break; if (error.code!=='23505') throw error;
  }
  if (error) throw error;
  await insertAlumnos(g.id, nomes, 0);
  return g;
}
async function insertAlumnos(grupoId, nomes, offset){
  for (let i=0;i<5;i++){
    const rows = nomes.map((n,j)=>({ grupo_id:grupoId, nome:n, codigo:code(5), orde:offset+j }));
    const { data, error } = await sb.from('sg_alumnos').insert(rows).select('id,nome');
    if (!error) return data;
    if (error.code!=='23505') throw error;
  }
  throw new Error('Non se puideron xerar códigos únicos. Téntao de novo.');
}

/* ---------------- Cargar un grupo (orientación) ---------------- */
async function openGrupo(id, tab){
  V.view='loading'; render();
  const [g, a, r] = await Promise.all([
    sb.from('sg_grupos').select('*').eq('id',id).single(),
    sb.from('sg_alumnos').select('id,nome,codigo,orde').eq('grupo_id',id).order('orde').order('nome'),
    sb.from('sg_respostas').select('alumno_id,datos,creado_en').eq('grupo_id',id)
  ]);
  const error = g.error||a.error||r.error;
  if (error) return showMsg(`<h2>Erro</h2><p class="muted">${esc(error.message)}</p><button class="btn sec" style="margin-top:14px" onclick="loadPanel()">Volver</button>`);
  CTX = { modo:'orientacion', grupoId:id, grupoRow:g.data, grupoCod:g.data.codigo, codigos:a.data.map(x=>({nome:x.nome,codigo:x.codigo})) };
  S = { config:{ grupo:g.data.nome, modelo:g.data.modelo, alumnos:a.data.map(x=>({id:x.id,nome:x.nome})) }, respostas:{} };
  r.data.forEach(x=>{ S.respostas[x.alumno_id] = Object.assign({}, x.datos, { data:x.creado_en }); });
  if (tab) V.tab = tab;
  V.filtro='E'; go('results');
}

/* ---------------- Titor/a: aplicación en dispositivo compartido ---------------- */
async function openTutor(cod){
  V.view='loading'; render();
  const { data, error } = await sb.rpc('sg_info', { p_grupo:cod, p_alumno:null });
  if (error) return showMsg(`<h2>Non se puido conectar</h2><p class="muted">${esc(error.message)}</p><button class="btn" style="margin-top:14px" onclick="location.reload()">Tentar de novo</button>`);
  if (!data) return showMsg('<h2>Ligazón non válida</h2><p class="muted">Este código de grupo non existe. Revisa a ligazón que che enviaron.</p>');
  if (data.pechado) return showMsg(`<h2>${esc(data.nome)}</h2><p class="muted">O cuestionario deste grupo está pechado. Fala co Departamento de Orientación.</p>`);
  CTX = { modo:'titor', grupoCod:cod.toUpperCase(), info:data };
  setInfo(data);
  await flushPend();
  go('tutor');
}
function setInfo(info){
  S = { config:{ grupo:info.nome, modelo:info.modelo, alumnos:info.alumnos.map(a=>({id:a.id,nome:a.nome})) }, respostas:{} };
  info.alumnos.forEach(a=>{ if (a.feito) S.respostas[a.id] = true; });
}
async function refreshTutor(){
  const { data } = await sb.rpc('sg_info', { p_grupo:CTX.grupoCod, p_alumno:null });
  if (data && !data.pechado){ CTX.info = data; setInfo(data); }
}

/* ---------------- Alumno/a con código persoal ---------------- */
async function openAlumno(cod){
  cod = String(cod||'').trim().toUpperCase();
  if (!cod){ V.err='Escribe o teu código.'; return go('landing'); }
  V.view='loading'; render();
  const { data, error } = await sb.rpc('sg_info', { p_grupo:null, p_alumno:cod });
  if (error){ V.view='landing'; V.err='Non se puido conectar. Comproba internet.'; return render(); }
  if (!data){ V.view='landing'; V.err='Ese código non existe. Revísao.'; return render(); }
  if (data.pechado) return showMsg('<div style="font-size:60px">🔒</div><h2>Cuestionario pechado</h2><p class="muted">Fala co teu titor ou titora.</p>');
  if (data.eu.feito) return showMsg(`<div style="font-size:60px">✅</div><h2>Xa respondiches</h2><p class="muted">O cuestionario de <b>${esc(data.eu.nome)}</b> xa está enviado. Grazas!</p>`);
  CTX = { modo:'alumno', alumnoCod:cod, info:data };
  setInfo(data);
  startKid(data.eu.id);
}

/* ---------------- Cuestionario (común) ---------------- */
function viewKidPick(){
  return topbar('🕸️ '+esc(S.config.grupo), 'Modo alumnado', `<button class="btn ghost" onclick="refreshTutor().then(()=>go('tutor'))">⬅ Titor/a</button>`) + `
  <div class="kid">
    <h2 style="margin:14px 0 6px">Ola! 👋 Quen es ti?</h2>
    <p class="qsub">Toca as túas iniciais para comezar</p>
    <div class="grid">${al().map(a=>{ const d = !!S.respostas[a.id];
      return `<button class="name ${d?'done':''}" ${d?'disabled':''} onclick="startKid('${a.id}')">${esc(a.nome)}${d?' ✅':''}</button>`; }).join('')}</div>
  </div>`;
}
function startKid(id){
  V.kid = id; V.step = 0; V.err='';
  V.draft = { nom:{}, por:{}, atr:{}, rank:{} };
  M().nominacions.forEach(q=>{ V.draft.nom[q.k]=[]; V.draft.por[q.k]=''; });
  go('kid');
}
function steps(){
  const m = M(), s = [{t:'intro'}];
  m.nominacions.forEach(q=>s.push({t:'nom', q}));
  m.atributos.forEach((a,i)=>s.push({t:'atr', a, i}));
  s.push({t:'rank'});
  return s;
}
function exitKid(){
  if (V.warn!=='exit'){ V.warn='exit'; return keepScroll(); }
  if (CTX.modo==='titor') go('kidpick'); else { V.err=''; go('landing'); }
}
function viewKid(){
  const st = steps(), cur = st[V.step], m = M(), d = V.draft;
  const others = al().filter(a=>a.id!==V.kid);
  const pct = Math.round(V.step/(st.length-1)*100);
  let body = '', canNext = true, nextTxt = 'Seguinte ➜';

  if (cur.t==='intro'){
    body = `<h2 style="margin-top:20px">Ola, ${esc(nm(V.kid))}! 😊</h2>
      <p class="qsub" style="font-size:19px;margin-top:14px">Imos facer unhas preguntas sobre os teus compañeiros e compañeiras.<br>
      Non hai respostas boas nin malas. <b>Contesta con sinceridade.</b><br>
      As túas respostas son <b>secretas</b>.</p>
      <p class="qsub">Os nomes aparecen coas iniciais (primeira letra do nome e do apelido).</p>`;
    nextTxt = 'Comezar ➜';
  }
  else if (cur.t==='nom'){
    const q = cur.q, sel = d.nom[q.k];
    const opp = m.nominacions.find(o=>o.ambito===q.ambito && o.tipo!==q.tipo);
    const blocked = new Set(opp ? d.nom[opp.k] : []);
    body = `<div class="q">${esc(q.txt)}</div>
      <p class="qsub">Escolle ata 3 (${sel.length}/3). Se non queres escoller a ninguén, toca <b>Seguinte</b>.</p>
      <div class="grid">${others.map(a=>{ const i = sel.indexOf(a.id);
        return `<button class="name ${i>=0?'sel':''}" data-n="${i+1}" ${blocked.has(a.id)?'disabled title="Xa o/a escolliches na outra pregunta"':''} onclick="toggleNom('${q.k}','${a.id}')">${esc(a.nome)}</button>`; }).join('')}</div>
      ${sel.length ? `<label style="font-size:17px;margin-top:20px">${esc(q.por)}</label>
      <textarea rows="3" style="font-size:17px" autocomplete="off" placeholder="Escribe aquí (se queres)" oninput="V.draft.por['${q.k}']=this.value">${esc(d.por[q.k])}</textarea>` : ''}`;
    if (!sel.length) nextTxt = 'Seguinte sen escoller ➜';
  }
  else if (cur.t==='atr'){
    const a = cur.a, v = d.atr[a.k];
    body = `<div class="qsub" style="margin:4px 0">Quen da túa clase destaca por...</div>
      <div class="q" style="font-size:27px">${esc(a.txt)}?</div>
      <p class="qsub">Toca unhas iniciais (pregunta ${cur.i+1} de ${m.atributos.length})</p>
      <div class="grid">${others.map(o=>`<button class="name ${v===o.id?'sel':''}" data-n="✓" onclick="pickAtr('${a.k}','${o.id}')">${esc(o.nome)}</button>`).join('')}
      <button class="name ${v===null?'sel':''}" data-n="✓" style="border-style:dashed;font-size:16px" onclick="pickAtr('${a.k}',null)">🤷 Ninguén / Non sei</button></div>`;
    canNext = a.k in d.atr;
  }
  else if (cur.t==='rank'){
    const done = others.filter(o=>d.rank[o.id]).length;
    body = `<div class="q">${esc(m.rankingTxt)}</div>
      <p class="qsub">Toca unha cara para cada compañeiro ou compañeira (${done}/${others.length})</p>
      <div class="card" style="padding:8px 14px">${others.map(o=>`<div class="rk"><div class="nm">${esc(o.nome)}</div><div class="faces">
        ${m.escala.map(e=>`<button class="face ${d.rank[o.id]===e.v?'on':''}" onclick="setRank('${o.id}',${e.v})"><span>${e.e}</span>${e.t}</button>`).join('')}
      </div></div>`).join('')}</div>
      ${V.warn==='rank'?`<div class="alert warn">Faltan ${others.length-done} compañeiros/as por valorar. Podes valoralos ou tocar <b>Enviar igualmente</b>.</div>`:''}
      ${V.err?`<div class="err">${esc(V.err)}</div>`:''}`;
    nextTxt = V.busy ? 'Enviando...' : V.warn==='rank' ? 'Enviar igualmente ✔' : 'Enviar ✔';
    canNext = !V.busy;
  }

  return `<div class="top no-print"><div><h1>${esc(nm(V.kid))}</h1><small>${esc(S.config.grupo)}</small></div>
    <button class="btn ghost" ${V.warn==='exit'?'style="background:#B91C1C;border-color:#B91C1C"':''} onclick="exitKid()">${V.warn==='exit'?'Saír sen enviar? Toca outra vez':'✕ Saír'}</button></div>
  <div class="kid"><div class="prog"><div style="width:${pct}%"></div></div>${body}
    <div class="nav">
      <button class="btn sec" ${V.step===0?'style="visibility:hidden"':''} onclick="V.step--;go('kid')">⬅ Atrás</button>
      <button class="btn" ${canNext?'':'disabled'} onclick="nextStep()">${nextTxt}</button>
    </div></div>`;
}
function keepScroll(){ const y = window.scrollY; render(); window.scrollTo(0,y); }
function toggleNom(k,id){
  const a = V.draft.nom[k], i = a.indexOf(id);
  if (i>=0) a.splice(i,1); else if (a.length<3) a.push(id);
  V.warn=null; keepScroll();
}
function pickAtr(k,id){
  V.draft.atr[k] = id; render();
  const at = V.step;
  setTimeout(()=>{ if (V.view==='kid' && V.step===at) nextStep(); }, 280);
}
function setRank(id,v){ V.draft.rank[id] = v; if (V.warn==='exit') V.warn=null; keepScroll(); }
function nextStep(){
  const st = steps(), cur = st[V.step];
  if (cur.t==='rank'){
    const others = al().filter(a=>a.id!==V.kid), falta = others.filter(o=>!V.draft.rank[o.id]).length;
    if (falta && V.warn!=='rank'){ V.warn='rank'; return keepScroll(); }
    return enviar();
  }
  V.step++; go('kid');
}
async function enviar(){
  const item = { grupo:CTX.grupoCod||null, alumno:V.kid, codigo:CTX.alumnoCod||null, datos:V.draft };
  V.busy = true; V.err=''; keepScroll();
  const res = await sendOne(item);
  V.busy = false;
  if (res==='ok' || res==='xa'){
    if (CTX.modo==='titor') S.respostas[V.kid] = true;
    V.draft = null; V.endMsg = res==='xa' ? 'Este cuestionario xa estaba enviado.' : ''; go('kidend'); return;
  }
  if (res==='pechado'){ V.err='O cuestionario está pechado. Fala co titor/a.'; return keepScroll(); }
  // erro de rede: gardar no dispositivo para enviar despois
  addPend(item);
  if (CTX.modo==='titor'){ S.respostas[V.kid] = true; V.draft=null; V.endMsg='Non había conexión: gardouse neste dispositivo e enviarase máis tarde.'; go('kidend'); }
  else { V.err='Non se puido enviar. Comproba a conexión e preme "Enviar" outra vez.'; keepScroll(); }
}
async function sendOne(it){
  try {
    const { error } = await sb.rpc('sg_enviar', { p_grupo:it.grupo, p_alumno_id:it.alumno, p_codigo_alumno:it.codigo, p_datos:it.datos });
    if (!error) return 'ok';
    if (/xa_respondido/.test(error.message)) return 'xa';
    if (/pechado/.test(error.message)) return 'pechado';
    if (/non_atopado|datos_invalidos/.test(error.message)) return 'invalido';
    return 'rede';
  } catch(e){ return 'rede'; }
}
function getPend(){ try { return JSON.parse(localStorage.getItem(pendKey))||[]; } catch(e){ return []; } }
function setPend(a){ try { localStorage.setItem(pendKey, JSON.stringify(a)); } catch(e){} }
function addPend(it){ const a = getPend().filter(x=>!(x.alumno===it.alumno)); a.push(it); setPend(a); }
async function flushPend(){
  const left = [];
  for (const it of getPend()){ const r = await sendOne(it); if (r==='rede') left.push(it); }
  setPend(left);
}
function viewKidEnd(){
  const nextBtn = CTX.modo==='titor'
    ? `<button class="btn big" style="margin-top:20px" onclick="refreshTutor().then(()=>go('kidpick'))">Seguinte compañeiro/a ➜</button>`
    : `<p class="qsub" style="margin-top:20px">Xa podes pechar esta páxina.</p>`;
  return `<div class="kid" style="text-align:center;padding-top:80px">
    <div style="font-size:80px">🎉</div><h2>Moitas grazas!</h2>
    <p class="qsub" style="font-size:19px">Xa remataches.</p>
    ${V.endMsg?`<p class="hint">${esc(V.endMsg)}</p>`:''}
    ${nextBtn}</div>`;
}

/* ---------------- Cálculos ---------------- */
function calc(){
  const m = M(), A = al(), R = S.respostas;
  const respIds = Object.keys(R).filter(id=>byId(id));
  const rows = A.map(a=>({ id:a.id, nome:a.nome, resp:!!R[a.id], E:{}, Rj:{}, tE:0, tR:0, pref:0,
    pos:0, neg:0, atr:{}, rSum:0, rN:0, pop:null, rejecters:new Set(), mutE:[], mutR:[], flags:[] }));
  const rowMap = new Map(rows.map(r=>[r.id,r]));
  rows.forEach(r=>{ m.nominacions.forEach(q=>{ (q.tipo==='E'?r.E:r.Rj)[q.k]=0; }); m.atributos.forEach(x=>r.atr[x.k]=0); });

  for (const from of respIds){
    const r = R[from];
    m.nominacions.forEach(q=>{
      (r.nom?.[q.k]||[]).forEach(to=>{ const t=rowMap.get(to); if(!t||to===from) return;
        if (q.tipo==='E'){ t.E[q.k]++; t.tE++; }
        else { t.Rj[q.k]++; t.tR++; t.rejecters.add(from); }
      });
    });
    m.atributos.forEach(x=>{ const t = r.atr && r.atr[x.k] && rowMap.get(r.atr[x.k]); if(!t) return;
      t.atr[x.k]++; if (x.s>0) t.pos++; else t.neg++; });
    for (const [to,v] of Object.entries(r.rank||{})){ const t=rowMap.get(to); if(t && to!==from){ t.rSum+=v; t.rN++; } }
  }
  const chose = (a,b,tipo) => { const r=R[a]; if(!r) return false;
    return m.nominacions.some(q=>q.tipo===tipo && (r.nom?.[q.k]||[]).includes(b)); };
  rows.forEach(r=>{
    r.pref = r.tE - r.tR;
    r.pop = r.rN ? r.rSum/r.rN : null;
    rows.forEach(o=>{ if (o.id===r.id) return;
      if (chose(r.id,o.id,'E') && chose(o.id,r.id,'E')) r.mutE.push(o.id);
      if (chose(r.id,o.id,'R') && chose(o.id,r.id,'R')) r.mutR.push(o.id); });
    const others = respIds.filter(i=>i!==r.id).length;
    r.umbral = others/3;
    r.byCount = r.rejecters.size>0 && r.rejecters.size > r.umbral;
    r.byRank = r.pop!==null && r.pop >= m.corteRanking;
    if (r.byCount && r.byRank) r.flags.push({c:'bad', t:'Rexeitado/a'});
    else if (r.byCount || r.byRank) r.flags.push({c:'warn', t:'Posible rexeitamento'});
    if (respIds.length && r.tE===0) r.flags.push({c:'bad', t:'Illado/a (0 eleccións)'});
    if (r.neg>=3 && r.neg>r.pos) r.flags.push({c:'warn', t:'Predominan atributos negativos'});
    if (r.mutE.length===0 && r.tE>0) r.flags.push({c:'info', t:'Sen eleccións recíprocas'});
  });
  return { rows, respIds, m };
}

function tResumo(C){

  const avisos = rows.filter(r=>!r.flags.some(f=>f.c==='bad') && r.flags.some(f=>f.c==='warn'));
  const pend = rows.filter(r=>!r.resp);
  const mutuas = rows.reduce((s,r)=>s+r.mutE.length,0)/2;
  const popM = rows.filter(r=>r.pop!==null); const popAvg = popM.length ? popM.reduce((s,r)=>s+r.pop,0)/popM.length : null;
  const card = r => `<div class="alert ${r.flags.some(f=>f.c==='bad')?'bad':'warn'}"><b>${esc(r.nome)}</b> ${pills(r)}
     <div class="hint" style="color:inherit">Eleccións: <b>${r.tE}</b> · Rexeitamentos: <b>${r.tR}</b> (de ${r.rejecters.size} compañeiros/as; limiar &gt; ${fmt(r.umbral)}) · Preferencia social: <b>${r.pref}</b> · Popularidade: <b>${fmt(r.pop)}</b> · Atributos +${r.pos} / −${r.neg}</div></div>`;
  return `
  <div class="kpis">
    <div class="kpi"><b>${resp}/${rows.length}</b><span>respostas</span></div>
    <div class="kpi"><b>${mutuas}</b><span>parellas de eleccións recíprocas</span></div>
    <div class="kpi"><b>${fmt(popAvg)}</b><span>popularidade media do grupo (1 = mellor)</span></div>
    <div class="kpi"><b>${esc(maxE?maxE.nome:'—')}</b><span>máis elixido/a (${maxE?maxE.tE:0})</span></div>
  </div>
  ${pend.length?`<div class="alert info">Faltan por responder: ${pend.map(r=>esc(r.nome)).join(', ')}. Os índices calcúlanse coas respostas dispoñibles.</div>`:''}
  <div class="card"><h3>🚨 Situacións que requiren atención (${graves.length})</h3>
    ${graves.length?graves.map(card).join(''):'<p class="muted">Ningún alumno/a cumpre os criterios de rexeitamento ou illamento.</p>'}</div>
  <div class="card"><h3>⚠️ Indicadores a observar (${avisos.length})</h3>
    ${avisos.length?avisos.map(card).join(''):'<p class="muted">Sen indicadores adicionais.</p>'}</div>
  <div class="card"><h3>Criterios aplicados</h3><ul class="muted" style="padding-left:20px;line-height:1.7;font-size:14px">
    <li><b>Rexeitado/a</b>: rexeitado por máis dun terzo dos compañeiros/as que contestaron <b>e</b> popularidade ≥ ${fmt(m.corteRanking)} na escala 1–${m.escala.length}. Se só se cumpre un dos dous: <i>posible rexeitamento</i>.</li>
    <li><b>Illado/a</b>: ningunha elección recibida.</li>
    <li><b>Preferencia social</b> = total de eleccións − total de rexeitamentos.</li>
    <li><b>Popularidade</b> = media das puntuacións recibidas na pregunta "${esc(m.rankingTxt)}" (1 = mellor; canto maior, peor estatus).</li>
    <li>Interpreta sempre os resultados tendo en conta a tendencia xeral do grupo e a observación directa.</li></ul></div>`;
}

function sortRows(rows){
  const {k,d} = V.sort;
  return [...rows].sort((a,b)=>{ let x=a[k], y=b[k];
    if (k==='nome') return d*x.localeCompare(y,'gl');
    if (x===null) return 1; if (y===null) return -1;
    return d*(x-y); });
}

  </tbody></table></div></div>`;
}

  <span><i style="background:#EF4444"></i>Rexeitado/a ou illado/a</span><span><i style="background:#CBD5E1"></i>Sen resposta propia</span></div></div>`;

function drawGraph(){
  const el = document.getElementById('graph'); if (!el) return;
  const {rows, m} = calc(), R = S.respostas, f = V.filtro;
  const W = 760, c = W/2, n = rows.length;
  const maxE = Math.max(1, ...rows.map(r=>r.tE));
  const order = [...rows].sort((a,b)=>a.nome.localeCompare(b.nome,'gl'));
  const pos = {};
  order.forEach((r,i)=>{
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const rad = 60 + (1 - r.tE/maxE) * (c-110);
    pos[r.id] = { x: c + rad*Math.cos(ang), y: c + rad*Math.sin(ang) };
  });
  const edges = [];
  const sel = (q) => f==='E'||f==='M' ? q.tipo==='E' : f==='R' ? q.tipo==='R' : q.k===f;
  const seen = new Set();
  for (const [from, r] of Object.entries(R)){
    m.nominacions.filter(sel).forEach(q=>(r.nom?.[q.k]||[]).forEach(to=>{
      if (!pos[from]||!pos[to]||from===to) return;
      const key = from+'>'+to; if (seen.has(key)) return; seen.add(key);
      edges.push({from,to,tipo:q.tipo});
    }));
  }
  const mutual = e => seen.has(e.to+'>'+e.from);
  let svg = `<svg viewBox="0 0 ${W} ${W}" width="100%" xmlns="http://www.w3.org/2000/svg">
   <defs><marker id="aE" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#16A34A"/></marker>
   <marker id="aR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#DC2626"/></marker></defs>`;
  [1,2,3].forEach(k=>svg+=`<circle cx="${c}" cy="${c}" r="${60+(c-110)*k/3}" fill="none" stroke="#E2E8F0" stroke-dasharray="4 5"/>`);
  const drawn = new Set();
  edges.forEach(e=>{
    const mu = mutual(e);
    if (f==='M' && !mu) return;
    if (mu){ const k=[e.from,e.to].sort().join('|'); if (drawn.has(k)) return; drawn.add(k); }
    const a = pos[e.from], b = pos[e.to];
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1, rr=19;
    const x1=a.x+dx/L*rr, y1=a.y+dy/L*rr, x2=b.x-dx/L*(rr+3), y2=b.y-dy/L*(rr+3);
    const col = e.tipo==='E' ? '#16A34A' : '#DC2626';
    if (mu) svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="3.5" opacity=".85"/>`;
    else svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="1.4" opacity=".55" ${e.tipo==='R'?'stroke-dasharray="5 4"':''} marker-end="url(#a${e.tipo})"/>`;
  });
  rows.forEach(r=>{
    const p = pos[r.id];
    const col = !r.resp ? '#CBD5E1' : r.flags.some(x=>x.c==='bad') ? '#EF4444' : r.flags.some(x=>x.c==='warn') ? '#F59E0B' : '#22C55E';
    svg += `<g><title>${esc(r.nome)} — E:${r.tE} R:${r.tR} PS:${r.pref}</title>
      <circle cx="${p.x}" cy="${p.y}" r="18" fill="${r.resp?col:'#F1F5F9'}" stroke="${col}" stroke-width="3"/>
      <text x="${p.x}" y="${p.y+4.5}" text-anchor="middle" font-size="12" font-weight="800" fill="${r.resp?'#fff':'#475569'}">${esc(iniciais(r.nome))}</text>
      ${iniciais(r.nome)!==r.nome?`<text x="${p.x}" y="${p.y+33}" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#fff" stroke-width="3">${esc(curto(r.nome))}</text>`:''}</g>`;
  });
  el.innerHTML = svg + '</svg>';
}

function tMotivos(){
  const m = M(), R = S.respostas;
  const list = al().map(a=>{
    const items = [];
    for (const [from, r] of Object.entries(R)) m.nominacions.forEach(q=>{
      if ((r.nom?.[q.k]||[]).includes(a.id) && r.por && r.por[q.k] && r.por[q.k].trim())
        items.push({q, from, txt:r.por[q.k].trim()});
    });
    return {a, items};
  }).filter(x=>x.items.length);
  return `<div class="card"><h3>Motivos das eleccións e rexeitamentos</h3>
  <p class="hint" style="margin-bottom:12px">Cada motivo aparece en todas as persoas que o neno/a nomeou nesa pregunta. Información confidencial.</p>
  ${list.length? list.map(({a,items})=>`<div style="margin-bottom:14px"><b>${esc(a.nome)}</b><ul style="padding-left:20px;margin-top:4px;font-size:14px;line-height:1.6">
    ${items.map(i=>`<li><span class="pill ${i.q.tipo==='E'?'ok':'bad'}">${esc(i.q.curto)}</span> <span class="muted">${esc(nm(i.from))}:</span> ${esc(i.txt)}</li>`).join('')}</ul></div>`).join('')
  : '<p class="muted">Non hai motivos escritos.</p>'}</div>`;
}

function tDatos(){
  return `<div class="card"><h3>Respostas recibidas</h3>
  <div class="tbl"><table><thead><tr><th class="l">Alumno/a</th><th>Estado</th><th>Data</th><th class="no-print"></th></tr></thead><tbody>
  ${al().map(a=>{ const r=S.respostas[a.id];
    return `<tr><td class="l">${esc(a.nome)}</td><td>${r?'<span class="pill ok">Respondido</span>':'<span class="pill warn">Pendente</span>'}</td>
    <td>${r&&r.data?new Date(r.data).toLocaleString('gl-ES'):''}</td>
    <td class="no-print">${r?`<button class="btn danger small" onclick="delResp('${a.id}')">Borrar para repetir</button>`:''}</td></tr>`; }).join('')}
  </tbody></table></div></div>
  <div class="card no-print"><h3>Descargar</h3>
    <p class="muted" style="margin-bottom:12px">Os datos están gardados en liña. Podes descargar unha copia cando queiras.</p>
    <div class="row"><button class="btn" onclick="exportJSON()">⬇ Copia completa (JSON)</button>
    <button class="btn sec" onclick="exportCSV()">⬇ Táboa resumo (CSV/Excel)</button>
    <label class="btn sec" style="margin:0">⬆ Importar respostas (JSON)<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this,CTX.grupoId)"></label></div></div>
  <div class="card no-print"><h3>Borrar o grupo</h3>
    <p class="muted" style="margin-bottom:12px">Elimina o grupo, os códigos e todas as respostas de forma definitiva. Descarga antes unha copia se a queres conservar.</p>
    <button class="btn danger" onclick="delGrupo()">Borrar o grupo</button></div>`;
}
async function delResp(id){
  if (!confirm('Borrar as respostas de '+nm(id)+'? Poderá volver respondelas.')) return;
  const { error } = await sb.from('sg_respostas').delete().eq('alumno_id', id);
  if (error) return alert('Erro: '+error.message);
  openGrupo(CTX.grupoId);
}
async function delGrupo(){
  if (!confirm('Seguro? Borrarase o grupo e todas as súas respostas.')) return;
  if (prompt('Escribe BORRAR para confirmar') !== 'BORRAR') return;
  const { error } = await sb.from('sg_grupos').delete().eq('id', CTX.grupoId);
  if (error) return alert('Erro: '+error.message);
  loadPanel();
}

/* ---------------- Exportar / importar ---------------- */
function download(name, text, type){
  const b = new Blob([text], {type}); const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 1000);
}
const slug = () => norm(S.config.grupo).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'grupo';
function exportJSON(){
  download(`sociograma-${slug()}-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({app:'sociograma', v:2, ...S}, null, 2), 'application/json');
}
function exportCSV(){
  const {rows, m} = calc();
  const qE = m.nominacions.filter(q=>q.tipo==='E'), qR = m.nominacions.filter(q=>q.tipo==='R');
  const head = ['Alumno/a', ...qE.map(q=>q.curto), 'Total eleccións', ...qR.map(q=>q.curto), 'Total rexeitamentos', 'Preferencia social',
    'Eleccións recíprocas', 'Atributos positivos', 'Atributos negativos', 'Popularidade', 'Indicadores'];
  const lines = [head, ...rows.map(r=>[r.nome, ...qE.map(q=>r.E[q.k]), r.tE, ...qR.map(q=>r.Rj[q.k]), r.tR, r.pref, r.mutE.length, r.pos, r.neg,
    r.pop===null?'':r.pop.toFixed(2).replace('.',','), r.flags.map(f=>f.t).join(' / ')])];
  const csv = '﻿' + lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  download(`sociograma-${slug()}.csv`, csv, 'text/csv;charset=utf-8');
}
// Importa un ficheiro exportado (versión local antiga ou esta). Se grupoId é null, crea un grupo novo.
function importFile(input, grupoId){
  const file = input.files[0]; if (!file) return;
  input.value = '';
  const rd = new FileReader();
  rd.onload = async () => {
    let d; try { d = JSON.parse(rd.result); } catch(e){ return alert('O ficheiro non é válido.'); }
    if (!d || !d.config || !Array.isArray(d.config.alumnos) || typeof d.respostas!=='object') return alert('O ficheiro non ten o formato desta aplicación.');
    try {
      let gid = grupoId, local;
      if (!gid){
        if (!confirm(`Crear o grupo "${d.config.grupo}" con ${d.config.alumnos.length} alumnos/as e ${Object.keys(d.respostas).length} respostas?`)) return;
        const g = await createGroup(d.config.grupo || 'Grupo importado', d.config.modelo, d.config.alumnos.map(a=>a.nome));
        gid = g.id;
        const { data } = await sb.from('sg_alumnos').select('id,nome').eq('grupo_id', gid);
        local = data;
      } else {
        if (d.config.modelo !== S.config.modelo) return alert('O ficheiro usa outro modelo de cuestionario.');
        local = al();
      }
      const map = {}; const sen = [];
      d.config.alumnos.forEach(a=>{ const l = local.find(x=>norm(x.nome)===norm(a.nome)); if (l) map[a.id]=l.id; else sen.push(a.nome); });
      const tr = id => map[id];
      const rows = [];
      for (const [fid, r] of Object.entries(d.respostas)){
        const lid = tr(fid); if (!lid || typeof r!=='object' || (grupoId && S.respostas[lid])) continue;
        const nr = { nom:{}, por:r.por||{}, atr:{}, rank:{} };
        for (const k in (r.nom||{})) nr.nom[k] = (r.nom[k]||[]).map(tr).filter(Boolean);
        for (const k in (r.atr||{})) nr.atr[k] = r.atr[k] ? (tr(r.atr[k])||null) : null;
        for (const k in (r.rank||{})) if (tr(k)) nr.rank[tr(k)] = r.rank[k];
        rows.push({ alumno_id:lid, grupo_id:gid, datos:nr, ...(r.data?{creado_en:r.data}:{}) });
      }
      if (rows.length){ const { error } = await sb.from('sg_respostas').insert(rows); if (error) throw error; }
      alert(`Importadas ${rows.length} respostas.` + (sen.length ? `\nNomes non atopados: ${sen.join(', ')}` : ''));
      openGrupo(gid, grupoId ? 'datos' : 'resumo');
    } catch(err){ alert('Erro ao importar: '+(err.message||err)); }
  };
  rd.readAsText(file);
}

boot();
</script>
